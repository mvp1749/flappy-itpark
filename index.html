<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
  <title>Game</title>
</head>
<body>
  <h1>Игра работает</h1>
</body>
</html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flappy Bird: IT Park Edition</title>
<style>
  :root{
    --panel:rgba(0,0,0,.32);
    --glass:rgba(0,0,0,.45);
    --green:#0c2f18;
    --green-2:#0e4a24;
    --line:rgba(255,255,255,.12);
  }
  html,body{height:100%;margin:0}
  body{background:#0f2328;font-family:ui-sans-serif,system-ui,-apple-system,Inter,Segoe UI,Roboto,Arial;color:#e8ffee;overflow:hidden}

  #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
  .chip{background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.35);backdrop-filter:blur(4px);white-space:nowrap}
  .chip b{font-weight:800}
  #canvas{display:block;width:100vw;height:100vh}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(5px);z-index:5}
  .card{position:relative;background:radial-gradient(1200px 800px at -10% -20%, rgba(0,255,190,.06), transparent 60%) , #0c2f18;border:1px solid var(--line);padding:22px 22px 20px;border-radius:20px;width:min(92vw,720px);box-shadow:0 22px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.03)}
  .row{display:flex;gap:10px;align-items:center;margin:0 0 14px 0}
  select{background:#0e4a24;color:#e8ffee;border-radius:12px;border:1px solid var(--line);padding:12px;flex:1}
  .grid-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{background:#0e4a24;border:1px solid var(--line);color:#e8ffee;padding:12px;border-radius:12px;cursor:pointer;font-weight:800;letter-spacing:.2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
  .btn:hover{filter:brightness(1.08)}
  .muted{opacity:.78}
  .hr{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:12px 0}
  .titleRow{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:900}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);padding:8px 12px;border-radius:999px;margin-right:6px}
  .flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  #historyOverlay .card{width:min(92vw,780px)}
  #historyList li{margin:6px 0}
  #smallbar{position:fixed;left:12px;bottom:12px;z-index:4;display:flex;gap:8px}
</style>
</head>
<body>
  <div id="hud">
    <span class="chip">⭐ <b id="score">0</b></span>
    <span class="chip">🎯 <b id="levelName">1</b></span>
    <span class="chip">🧱 <b id="progress">0/0</b></span>
    <span class="chip">💡 <b id="ideaCnt">0</b></span>
    <span class="chip">👥 <b id="usersCnt">0</b></span>
    <span class="chip">💰 <b id="fundCnt">0</b></span>
  </div>

  <canvas id="canvas"></canvas>

  <!-- Старт -->
  <div id="startOverlay" class="overlay" style="display:flex">
    <div class="card">
      <div class="titleRow">🎮 <span>Flappy IT Park</span></div>
      <div class="row">
        <label for="levelSel" style="white-space:nowrap">Уровень</label>
        <select id="levelSel">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        </select>
      </div>
      <div class="grid-btns" style="margin-top:6px">
        <button id="overlayStartBtn" class="btn" style="grid-column:span 2">Старт</button>
        <button id="openHistoryBtn" class="btn" style="grid-column:span 2">Журнал забегов</button>
      </div>
    </div>
  </div>

  <!-- Победа -->
  <div id="winOverlay" class="overlay" style="display:none">
    <div class="card" style="text-align:center">
      <div class="titleRow">🏆 <span>Победа</span></div>
      <div class="flex" style="margin:8px 0 6px 0">
        <span class="pill">⭐ <b id="winScore">0</b></span>
        <span class="pill">⏱️ <b id="winTime">00:00</b></span>
        <span class="pill" id="winBonuses">💡0/0 👥0/0 💰0/0</span>
        <span class="pill" id="winBadge" title="Награда уровня"></span>
      </div>
      <div class="hr"></div>
      <div class="grid-btns" style="margin-top:8px">
        <button id="nextBtn" class="btn">Следующий</button>
        <button id="retryBtn" class="btn">Переиграть</button>
        <button id="chooseBtn" class="btn" style="grid-column:span 2">Меню</button>
      </div>
    </div>
  </div>

  <!-- Проигрыш -->
  <div id="loseOverlay" class="overlay" style="display:none">
    <div class="card" style="text-align:center">
      <div class="titleRow">💥 <span>Проигрыш</span></div>
      <div class="flex" style="margin:8px 0 6px 0">
        <span class="pill">⭐ <b id="loseScore">0</b></span>
        <span class="pill">⏱️ <b id="loseTime">00:00</b></span>
        <span class="pill" id="loseBonuses">💡0/0 👥0/0 💰0/0</span>
      </div>
      <div class="hr"></div>
      <div class="grid-btns" style="margin-top:8px">
        <button id="loseRetryBtn" class="btn">Переиграть</button>
        <button id="loseMenuBtn" class="btn">Меню</button>
      </div>
    </div>
  </div>

  <!-- Журнал забегов -->
  <div id="historyOverlay" class="overlay" style="display:none">
    <div class="card">
      <div class="titleRow">📒 <span>Журнал забегов</span></div>
      <div class="hr"></div>
      <ol id="historyList" style="margin:0;padding-left:22px"></ol>
      <div class="grid-btns" style="margin-top:12px">
        <button id="backFromHistoryBtn" class="btn" style="grid-column:span 2">← Назад</button>
      </div>
    </div>
  </div>

  <div id="smallbar"><button id="pauseBtn" class="btn">⏸</button><button id="resetBtn" class="btn">↺</button></div>

<script>
(() => {
  // ---------- helpers ----------
  function img(srcs, onload){
    const im = new Image(); let i=0;
    im.onload = ()=>onload && onload(im);
    im.onerror = ()=>{ i++; if(i<srcs.length) im.src=srcs[i]; };
    im.src = srcs[0]; return im;
  }
  const rand=(a,b)=>Math.random()*(b-a)+a, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const DPR=Math.max(1,Math.floor(devicePixelRatio||1));
  const pad2=n=>String(n).padStart(2,'0');
  const fmtTime = (sec)=>`${pad2((sec/60|0))}:${pad2(sec%60)}`;

  // ---------- assets ----------
  const bg = img(["bg.png","bg-city.png"]);
  const topRail = img(["top-rail.png","top-rail.jpg","top-rail.webp"]);
  const lampRound = img(["lamp-round.png"]);
  const lampTube  = img(["lamp.png"]);
  const lamps = [lampRound, lampTube];
  const towerL = img(["Фон 4.png","tower1.png"]);
  const towerR = img(["Фон 5.png","tower2.png"]);
  const towers = [towerL, towerR];
  const birdImg = img(["52.png","52.jpg","logo-bird.png"]);
  let birdW0=120,birdH0=90; birdImg.onload=()=>{birdW0=birdImg.naturalWidth||birdW0; birdH0=birdImg.naturalHeight||birdH0;};

  /* бэджи финала по уровням */
  const tokenBadgeImg = {
    startup: img(["token-startup.png"]),
    cash:    img(["token-cash.png"]),
    unicorn: img(["token-unicorn.png"])
  };
  const BADGE_EMOJI = { startup:'🚀', cash:'💰', unicorn:'🦄' };

  // ---------- config ----------
  const CONFIG={
    gravity:2100, jump:560,
    pipeW:90, birdW:68, birdH:54,
    topRailH:18,
    bottomKillPct:0.965,
    firstBuffer:0.22,
    lampWidthFracMin:0.62, lampWidthFracMax:0.76,
    minCable:22, clearance:12, capH:8,
    lampBobAmp:6, lampBobFreq:1.15,
    towerScaleMin:0.86, towerScaleMax:1.14,
    towerHitInset:10, towerHitTopTrim:6,
    bgParallax:0.32
  };
  topRail.onload=()=>{ CONFIG.topRailH = Math.max(6, topRail.naturalHeight||CONFIG.topRailH); };

  // уровни + привязка финального бэджа
  const LEVELS={
    1:{name:'1',speed:195,gap:252,spacing:255,count:12,wobble:6,  final:'startup'},
    2:{name:'2',speed:210,gap:242,spacing:246,count:16,wobble:9,  final:'cash'},
    3:{name:'3',speed:222,gap:236,spacing:240,count:20,wobble:12, final:'unicorn'}
  };

  const TOKENS=[{key:'idea',emoji:'💡',points:10,color:'#baffc9'},
                {key:'users',emoji:'👥',points:12,color:'#a8d1ff'},
                {key:'fund',emoji:'💰',points:15,color:'#ffe98a'}];

  // ---------- canvas ----------
  const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
  function resize(){ canvas.width=Math.floor(innerWidth*DPR); canvas.height=Math.floor(innerHeight*DPR);
    canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize(); addEventListener('resize',resize);

  // ---------- state ----------
  let state='ready', last=performance.now(), globalT=0;
  const bird={x:innerWidth*0.26,y:innerHeight*0.45,vy:0,w:CONFIG.birdW,h:CONFIG.birdH};
  let pipes=[], tokens=[], score=0, passed=0;
  let currentLevel=1, LVL=LEVELS[1];
  let gameStartTs=null; let celeb=null;
  const bonus={idea:0,users:0,fund:0}; const popups=[];
  let bgScroll=0;

  // journal / run counter
  const HISTORY_KEY='flappyItPark_history_v3';
  const RUN_KEY='flappyItPark_runNo';
  let tokenTotals={idea:0,users:0,fund:0};
  function nextRunNo(){ let n=parseInt(localStorage.getItem(RUN_KEY)||'0',10); n++; localStorage.setItem(RUN_KEY,String(n)); return n; }
  function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }catch(e){ return []; } }
  function saveHistory(a){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(a.slice(0,30))); }catch(e){} }
  function pushHistory(entry){ const a=loadHistory(); a.unshift(entry); saveHistory(a); }

  // ---------- ui refs ----------
  const scoreEl=document.getElementById('score'),
        progressEl=document.getElementById('progress'),
        levelNameEl=document.getElementById('levelName'),
        ideaCnt=document.getElementById('ideaCnt'),
        usersCnt=document.getElementById('usersCnt'),
        fundCnt=document.getElementById('fundCnt');

  const startOverlay=document.getElementById('startOverlay'),
        winOverlay=document.getElementById('winOverlay'),
        loseOverlay=document.getElementById('loseOverlay');

  const levelSel=document.getElementById('levelSel'),
        overlayStartBtn=document.getElementById('overlayStartBtn'),
        nextBtn=document.getElementById('nextBtn'),
        retryBtn=document.getElementById('retryBtn'),
        chooseBtn=document.getElementById('chooseBtn');

  const winScoreEl=document.getElementById('winScore'),
        winTimeEl=document.getElementById('winTime'),
        winBonusesEl=document.getElementById('winBonuses'),
        winBadgeEl=document.getElementById('winBadge');

  const pauseBtn=document.getElementById('pauseBtn'),
        resetBtn=document.getElementById('resetBtn'),
        openHistoryBtn=document.getElementById('openHistoryBtn');

  const historyOverlay=document.getElementById('historyOverlay'),
        historyList=document.getElementById('historyList'),
        backFromHistoryBtn=document.getElementById('backFromHistoryBtn');

  const loseScoreEl=document.getElementById('loseScore'),
        loseTimeEl=document.getElementById('loseTime'),
        loseBonusesEl=document.getElementById('loseBonuses'),
        loseRetryBtn=document.getElementById('loseRetryBtn'),
        loseMenuBtn=document.getElementById('loseMenuBtn');

  function applyLevel(n){ currentLevel=+n; LVL=LEVELS[currentLevel]; levelNameEl.textContent=LVL.name; }
  levelNameEl.textContent=LVL.name;

  function renderHistory(){
    const a=loadHistory();
    historyList.innerHTML = a.length? a.map(e=>{
      const icon = e.win? '🏆':'💥';
      const bonusStr = `💡${e.bonuses.idea}/${e.totals.idea} 👥${e.bonuses.users}/${e.totals.users} 💰${e.bonuses.fund}/${e.totals.fund}` + (e.badge?` ${BADGE_EMOJI[e.badge]||''}`:'');
      const d = new Date(e.ts);
      return `<li>№${e.run} • ${icon} <b>${e.score}</b> • ${fmtTime(e.timeSec)} • L${e.level} • ${d.toLocaleDateString()} &nbsp; ${bonusStr}</li>`;
    }).join('') : '<div class="muted">Пока пусто</div>';
  }

  // ---------- geometry helpers ----------
  function lampBob(p){ return Math.sin((p.lampPhase||0) + globalT*CONFIG.lampBobFreq) * CONFIG.lampBobAmp; }
  function getLampGeom(p){
    const w=CONFIG.pipeW, topKill=CONFIG.topRailH;
    const limg = lamps[p.lampType];
    const srcW = limg.naturalWidth||120, srcH = limg.naturalHeight||160;
    const dw = p.dw, dh = p.dh;
    const bob = lampBob(p);
    const lx = p.x + (w-dw)/2;
    const ly = p.ly + bob;
    const cableX = p.x + w/2 - 2;
    const cableY = topKill + CONFIG.capH;
    const cableH = p.cableH + bob;
    return {lx,ly,dw,dh,cableX,cableY,cableW:4,cableH};
  }

  // ---------- game setup ----------
  let currentRun=0;
  function resetBonuses(){ bonus.idea=bonus.users=bonus.fund=0; ideaCnt.textContent=usersCnt.textContent=fundCnt.textContent=0; }
  function showStart(v){ startOverlay.style.display=v?'flex':'none'; }
  function showWin(v){ winOverlay.style.display=v?'flex':'none'; }
  function showLose(v){ loseOverlay.style.display=v?'flex':'none'; }
  function effectiveCount(){ return LVL.count; }

  function makeLampForPipe(p,L){
    const topKill=CONFIG.topRailH;
    const limgIdx = (Math.random()<0.5?0:1);
    const dw = CONFIG.pipeW * rand(CONFIG.lampWidthFracMin, CONFIG.lampWidthFracMax);
    const im = lamps[limgIdx]||{};
    const srcW = im.naturalWidth||120, srcH = im.naturalHeight||160;
    let dh = dw * (srcH/srcW);

    const cableStart = topKill + CONFIG.capH;
    const maxAvail = (p.topH - CONFIG.clearance) - (cableStart + CONFIG.minCable);
    if(dh > maxAvail){ dh = Math.max(34, maxAvail); }
    let ly = p.topH - CONFIG.clearance - dh;
    let cableH = ly - cableStart;
    if(cableH < CONFIG.minCable){ const need = CONFIG.minCable - cableH; ly += need; cableH = CONFIG.minCable; }

    return {
      lampType:limgIdx, dw, dh, ly, cableH,
      towerType:(Math.random()<0.5?0:1),
      towerPhase:rand(0,Math.PI*2),
      lampPhase:rand(0,Math.PI*2)
    };
  }

  function generatePipes(L, bufferSec, smooth=90){
    const arr=[], firstX=innerWidth + L.speed*(bufferSec??1.2);
    const topKill=CONFIG.topRailH, bottomKill=innerHeight*CONFIG.bottomKillPct;
    const minTop=topKill+40, maxTop=bottomKill-L.gap-60;
    let prevTop=clamp(rand(minTop,maxTop),minTop,maxTop);
    for(let i=0;i<effectiveCount();i++){
      const low=clamp(prevTop-smooth,minTop,maxTop), high=clamp(prevTop+smooth,minTop,maxTop);
      const topH=clamp(rand(low,high),minTop,maxTop);
      const base={ x:firstX+i*L.spacing, topH, passed:false };
      const deco = makeLampForPipe({topH}, L);
      arr.push(Object.assign(base, deco));
      prevTop=topH;
    }
    return arr;
  }

  function chooseTokenIdxs(n){
    if(n<=3) return [0,Math.max(1,n-2),Math.max(2,n-1)];
    const a=clamp(Math.round(n*0.20+rand(-1,1)),1,n-2),
          b=clamp(Math.round(n*0.60+rand(-1,1)),2,n-1),
          c=clamp(Math.round(n*0.90+rand(-1,0)),3,n-1);
    const set=Array.from(new Set([a,b,c])); while(set.length<3){ const r=clamp(Math.round(rand(1,n-1)),1,n-1); if(!set.includes(r)) set.push(r); }
    return set.sort((x,y)=>x-y);
  }

  function generateTokens(pp,L){
    tokenTotals={idea:0,users:0,fund:0};
    const arr=[], idxs=chooseTokenIdxs(pp.length);
    idxs.forEach((i,k)=>{
      const p=pp[i], t=TOKENS[k];
      const x=p.x+CONFIG.pipeW/2, y=p.topH+L.gap/2+rand(-L.gap*.28,L.gap*.28);
      tokenTotals[t.key]++;
      arr.push({x,y,emoji:t.emoji,key:t.key,points:t.points,collected:false,alpha:1,t:0,color:t.color});
    });
    return arr;
  }

  function resetGame(){
    state='ready'; score=0; passed=0;
    scoreEl.textContent='0'; progressEl.textContent=`0/${LVL.count}`;
    bird.x=innerWidth*0.26; bird.y=innerHeight*0.45; bird.vy=0;
    celeb=null; gameStartTs=null; popups.length=0; resetBonuses(); bgScroll=0; globalT=0;
    pipes = generatePipes(LVL, CONFIG.firstBuffer, 90);
    tokens = generateTokens(pipes, LVL);
    showStart(true); showWin(false); showLose(false);
  }
  function startGame(){
    if(state==='playing')return;
    if(state==='gameover'||state==='win')resetGame();
    currentRun = nextRunNo();
    state='playing'; gameStartTs=Date.now();
    showStart(false); showWin(false); showLose(false);
  }

  // ---------- update ----------
  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  function update(dt){
    globalT+=dt;
    if(state==='playing'){
      bgScroll += LVL.speed * CONFIG.bgParallax * dt;

      bird.vy+=CONFIG.gravity*dt; bird.y+=bird.vy*dt;

      for(const p of pipes){
        p.x-=LVL.speed*dt;
        const swing = Math.sin((p.x*0.004 + globalT*1.4))*0.5 + Math.sin((p.x*0.006 - globalT*0.9))*0.5;
        p._topShift = swing * LVL.wobble;
        if(!p.passed && p.x+CONFIG.pipeW<bird.x){
          p.passed=true; passed++; score++; scoreEl.textContent=score; progressEl.textContent=`${passed}/${effectiveCount()}`;
          if(passed>=effectiveCount()){ startCelebration(); return; }
        }
      }
      pipes=pipes.filter(p=>p.x+CONFIG.pipeW>-120);

      for(const t of tokens){ t.x-=LVL.speed*dt; t.t+=dt; }

      const topKill=CONFIG.topRailH, bottomKill=innerHeight*CONFIG.bottomKillPct;
      const die=()=>{
        state='gameover'; showLose(true);
        const timeSec=Math.max(0,Math.round((Date.now()-gameStartTs)/1000));
        loseScoreEl.textContent=String(score);
        loseTimeEl.textContent=fmtTime(timeSec);
        loseBonusesEl.textContent=`💡${bonus.idea}/${tokenTotals.idea} 👥${bonus.users}/${tokenTotals.users} 💰${bonus.fund}/${tokenTotals.fund}`;
        pushHistory({run:currentRun,win:false,score,timeSec,level:currentLevel,bonuses:{...bonus},totals:{...tokenTotals},badge:LVL.final,ts:Date.now()});
      };

      if(bird.y<topKill || (bird.y+bird.h)>bottomKill){ die(); return; }

      for(const p of pipes){
        const inX=(bird.x+bird.w)>p.x && bird.x<(p.x+CONFIG.pipeW);
        if(!inX) continue;

        // верх: лампа + трос
        const L = getLampGeom(p);
        const hitLamp = rectsOverlap(bird.x,bird.y,bird.w,bird.h, L.lx, L.ly, L.dw, L.dh) ||
                        rectsOverlap(bird.x,bird.y,bird.w,bird.h, L.cableX, L.cableY, L.cableW, L.cableH);
        if(hitLamp){ die(); return; }

        // низ: башня (урезанный хитбокс)
        const gt=p.topH + (p._topShift||0), gb=gt+LVL.gap;
        const bottomH = bottomKill - gb;
        if(bottomH>4){
          const towerImg = towers[p.towerType]||{};
          const osc = Math.sin(p.towerPhase + globalT*1.3);
          const s = clamp( (CONFIG.towerScaleMin + (osc+1)/2*(CONFIG.towerScaleMax-CONFIG.towerScaleMin)), 0.7, 1.3 );
          let dw2, dh2, dx2, dy2;
          if(towerImg.naturalWidth){
            const s0 = Math.min(CONFIG.pipeW/towerImg.naturalWidth, bottomH/towerImg.naturalHeight);
            dw2=towerImg.naturalWidth*s0*s; dh2=towerImg.naturalHeight*s0*s;
            dx2=p.x+(CONFIG.pipeW-dw2)/2; dy2=bottomKill - dh2;
          }else{
            dw2=CONFIG.pipeW*s*0.78; dh2=bottomH*s; dx2=p.x+(CONFIG.pipeW-dw2)/2; dy2=bottomKill - dh2;
          }
          const ix=dx2+CONFIG.towerHitInset, iw=Math.max(2,dw2-CONFIG.towerHitInset*2);
          const iy=dy2+CONFIG.towerHitTopTrim, ih=Math.max(2,dh2-CONFIG.towerHitTopTrim);
          if(rectsOverlap(bird.x,bird.y,bird.w,bird.h, ix,iy,iw,ih)){ die(); return; }
        }
      }

      // сбор токенов
      for(const t of tokens){
        if(t.collected) continue;
        const r=18;
        const ok=(bird.x<t.x+r && bird.x+bird.w>t.x-r && bird.y<t.y+r && bird.y+bird.h>t.y-r);
        if(ok){
          t.collected=true; score+=t.points; scoreEl.textContent=score;
          bonus[t.key]++; ideaCnt.textContent=bonus.idea; usersCnt.textContent=bonus.users; fundCnt.textContent=bonus.fund;
          popups.push({x:t.x,y:t.y,text:`+${t.points}`,life:0});
        }
      }
      tokens=tokens.filter(t=>t.x>-40 && (!t.collected || t.alpha>0));
      for(const t of tokens){ if(t.collected) t.alpha-=dt*1.6; }
      for(const p of popups){ p.life+=dt; p.y-=40*dt; } while(popups.length && popups[0].life>0.9) popups.shift();
    }

    if(state==='celebrate'){ updateCelebrate(dt); }
  }

  // ---------- celebration ----------
  function startCelebration(){
    state='celebrate';
    const pedW=180, pedX=(innerWidth-pedW)/2;
    const pedTopTarget = innerHeight*CONFIG.bottomKillPct - 260;
    celeb={
      t:0, confetti:[], confettiStart:false, confettiPulse:0, confettiTimer:0,
      ped:{x:pedX,w:pedW,top:innerHeight*CONFIG.bottomKillPct, topTarget:pedTopTarget},
      spotPulse:0, bannerPulse:0
    };
    spawnConfetti(240, pedX+pedW/2, pedTopTarget-44);
  }
  function updateCelebrate(dt){
    celeb.t+=dt;
    celeb.ped.top += (celeb.ped.topTarget - celeb.ped.top) * Math.min(1, dt*2.6);
    celeb.spotPulse += dt; celeb.bannerPulse += dt*0.8;

    // птица позиционируется над бэджем
    const birdTargetX = innerWidth/2 - bird.w/2;
    const birdTargetY = celeb.ped.top - 140;
    bird.x += (birdTargetX - bird.x) * Math.min(1, dt*3.0);
    bird.y += (birdTargetY - bird.y) * Math.min(1, dt*3.0);
    bird.vy = 0;

    if(!celeb.confettiStart && celeb.t>0.35){ celeb.confettiStart=true; }
    if(celeb.confettiStart){
      celeb.confettiTimer+=dt;
      if(celeb.confettiPulse<6 && celeb.confettiTimer>=0.5){
        celeb.confettiTimer=0; celeb.confettiPulse++;
        spawnConfetti(160, celeb.ped.x+celeb.ped.w/2, celeb.ped.top-50);
      }
      for(const c of celeb.confetti){ c.vy+=900*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.r+=c.rv*dt; }
      celeb.confetti=celeb.confetti.filter(c=>c.y<innerHeight+90);
    }
    if(celeb.t>4.6){
      state='win';
      const timeSec=Math.max(0,Math.round((Date.now()-gameStartTs)/1000));
      winScoreEl.textContent=String(score);
      winTimeEl.textContent=fmtTime(timeSec);
      winBonusesEl.textContent=`💡${bonus.idea}/${tokenTotals.idea} 👥${bonus.users}/${tokenTotals.users} 💰${bonus.fund}/${tokenTotals.fund}`;

      // вывести бэдж победы в оверлее
      winBadgeEl.textContent = BADGE_EMOJI[LVL.final] || '🦄';
      winBadgeEl.style.width=''; winBadgeEl.style.height=''; winBadgeEl.style.background='none';
      const im = tokenBadgeImg[LVL.final];
      if (im.complete && im.naturalWidth){
        winBadgeEl.textContent='';
        winBadgeEl.style.width='32px';
        winBadgeEl.style.height='32px';
        winBadgeEl.style.display='inline-block';
        winBadgeEl.style.background=`center/contain no-repeat url(${im.src})`;
      }

      pushHistory({run:currentRun,win:true,score,timeSec,level:currentLevel,bonuses:{...bonus},totals:{...tokenTotals},badge:LVL.final,ts:Date.now()});
      showWin(true);
    }
  }
  function spawnConfetti(n, x0, y0){
    for(let i=0;i<n;i++)
      celeb.confetti.push({x:x0+Math.random()*180-90,y:y0+Math.random()*50-25,vx:Math.random()*520-260,vy:-(320+Math.random()*280),r:Math.random()*Math.PI*2,rv:Math.random()*12-6,s:4+Math.random()*4});
  }

  // ---------- draw ----------
  function drawBG(){
    ctx.fillStyle="#0e2330"; ctx.fillRect(0,0,innerWidth,innerHeight);
    if(!(bg.complete&&bg.naturalWidth)) return;
    const iw=bg.naturalWidth, ih=bg.naturalHeight, s = innerHeight/ih;
    const w = iw*s, h = innerHeight; let x0 = - (bgScroll % w);
    for(let x=x0; x<innerWidth; x+=w) ctx.drawImage(bg, x, innerHeight-h, w, h);
  }
  function drawTopRail(){
    const h=CONFIG.topRailH;
    if(topRail.complete&&topRail.naturalWidth) ctx.drawImage(topRail,0,0,innerWidth,h);
    else { ctx.fillStyle="#27d1a5"; ctx.fillRect(0,0,innerWidth,h); }
  }
  function roundRect(x,y,w,h,r){ ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); }
  function confettiColor(c){ const p=['#fff','#ffea00','#ff5e5e','#6ee7ff','#baffc9','#ffd6a5','#c3a6ff']; return p[(Math.abs((c.vx|0)+(c.vy|0))%p.length)]; }

  function drawCelebrationStage(){
    if(!celeb) return;
    const x=celeb.ped.x, w=celeb.ped.w, y0=celeb.ped.top, h=innerHeight*CONFIG.bottomKillPct - y0;

    // мягкий спот-лайт
    const pulse = 0.5 + 0.5*Math.sin(celeb.spotPulse*2.2);
    ctx.save();
    const g=ctx.createRadialGradient(x+w/2, y0-44, 24, x+w/2, y0-44, 460);
    g.addColorStop(0, `rgba(0,255,190,${0.22+0.18*pulse})`); g.addColorStop(1, 'rgba(0,255,190,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.restore();

    // подиум
    ctx.save();
    const gg=ctx.createLinearGradient(0,y0,0,y0+h);
    gg.addColorStop(0,'rgba(0,255,190,.72)'); gg.addColorStop(1,'rgba(0,255,190,.16)');
    ctx.fillStyle=gg; ctx.shadowColor='rgba(0,255,190,.8)'; ctx.shadowBlur=24; ctx.fillRect(x,y0,w,h);
    ctx.restore();

    ctx.save();
    const topH=16; const tg=ctx.createLinearGradient(x,y0,x,y0+topH);
    tg.addColorStop(0,'rgba(0,255,190,.95)'); tg.addColorStop(1,'rgba(0,255,190,.35)');
    ctx.fillStyle=tg; ctx.fillRect(x-8,y0-8,w+16,topH);
    ctx.globalAlpha=0.25; ctx.fillStyle='#fff'; ctx.fillRect(x+10,y0+2,w-20,3);
    ctx.globalAlpha=0.12; ctx.fillStyle='#00ffd0';
    for(let i=0;i<6;i++){ const yy=y0+topH+ i*12 + (Math.sin(globalT*2+i)*2); ctx.fillRect(x+6, yy, w-12,3); }
    ctx.restore();

    // баннер
    const bannerY = CONFIG.topRailH + 110;
    const text='✨ Поздравляем! ✨';
    ctx.save(); ctx.font='800 26px Inter, Arial';
    const tw=ctx.measureText(text).width; const bw=Math.min(tw+36,innerWidth*.9);
    const bx=(innerWidth-bw)/2; const by=bannerY-26;
    const alpha = 0.40 + 0.12*Math.sin(celeb.bannerPulse*2.6);
    ctx.beginPath(); roundRect(bx,by,bw,46,14); ctx.fillStyle=`rgba(0,0,0,${alpha})`; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.stroke();
    const lg=ctx.createLinearGradient(bx,by,bx,by+20); lg.addColorStop(0,'#fff4a8'); lg.addColorStop(1,'#ffbf3e');
    ctx.fillStyle=lg; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2; ctx.fillText(text, innerWidth/2, bannerY-3);
    ctx.restore();

    // бэдж уровня на сцене (крупный)
    const key = LVL.final;
    const im  = tokenBadgeImg[key];
    const size = 96, bx2 = x+w/2 - size/2, by2 = y0 - size + 6;
    if (im.complete && im.naturalWidth) {
      ctx.save();
      ctx.shadowColor='rgba(255,255,255,.55)';
      ctx.shadowBlur=18;
      ctx.drawImage(im, bx2, by2, size, size);
      ctx.restore();
    } else {
      ctx.save();
      ctx.font='76px Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji';
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.shadowColor='rgba(255,255,255,.6)'; ctx.shadowBlur=18;
      ctx.fillText(BADGE_EMOJI[key]||'🦄', x+w/2, y0-4);
      ctx.restore();
    }
  }

  function drawObstacle(p){
    const x=p.x, w=CONFIG.pipeW;
    const topKill=CONFIG.topRailH, bottomKill=innerHeight*CONFIG.bottomKillPct;

    ctx.fillStyle='rgba(39,209,165,.95)'; ctx.fillRect(x, topKill, w, CONFIG.capH);

    const L = getLampGeom(p);
    const limg = lamps[p.lampType];
    ctx.fillStyle='rgba(39,209,165,.85)';
    ctx.fillRect(L.cableX, L.cableY, L.cableW, L.cableH);
    ctx.beginPath(); ctx.arc(L.cableX+L.cableW/2, L.cableY+L.cableH, 4, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.globalAlpha=0.16; ctx.fillStyle='#2bf7c1';
    ctx.beginPath(); ctx.ellipse(x+w/2, L.ly+L.dh-10, L.dw*0.36, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
    if(limg.complete && limg.naturalWidth) ctx.drawImage(limg, 0, 0, limg.naturalWidth, limg.naturalHeight, L.lx, L.ly, L.dw, L.dh);
    else { ctx.fillStyle="#2be9b3"; ctx.beginPath(); ctx.arc(x+w/2, L.ly+L.dh-22, 20, 0, Math.PI*2); ctx.fill(); }

    const gt=p.topH + (p._topShift||0), gb=gt+LVL.gap;
    const bottomH = bottomKill - gb;
    if(bottomH>0){
      const towerImg = towers[p.towerType]||{};
      const osc = Math.sin(p.towerPhase + globalT*1.3);
      const s = clamp( (CONFIG.towerScaleMin + (osc+1)/2*(CONFIG.towerScaleMax-CONFIG.towerScaleMin)), 0.7, 1.3 );
      if(towerImg.complete && towerImg.naturalWidth){
        const s0 = Math.min(w/towerImg.naturalWidth, bottomH/towerImg.naturalHeight);
        const dw2=towerImg.naturalWidth*s0*s, dh2=towerImg.naturalHeight*s0*s, dx2=x+(w-dw2)/2, dy2=bottomKill-dh2;
        ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#00ffd0'; ctx.shadowColor='#00ffd0'; ctx.shadowBlur=18; ctx.fillRect(dx2-3, dy2-3, dw2+6, dh2+6); ctx.restore();
        ctx.drawImage(towerImg, dx2, dy2, dw2, dh2);
      }else{
        ctx.fillStyle="#17b57f"; const dw2=w*0.78*s, dh2=bottomH*s, dx2=x+(w-dw2)/2, dy2=bottomKill-dh2; ctx.fillRect(dx2, dy2, dw2, dh2);
      }
    }
  }

  function draw(){
    drawBG(); drawTopRail();
    for(const p of pipes) drawObstacle(p);

    if(state==='playing'){
      for(const t of tokens){
        if(t.alpha<=0) continue; const r=18,bob=Math.sin((t.t||0)*2)*3;
        ctx.save(); ctx.globalAlpha=Math.max(0.2,Math.min(1,t.alpha));
        const grd=ctx.createRadialGradient(t.x,t.y+bob,2,t.x,t.y+bob,r);
        grd.addColorStop(0,'#ffffff'); grd.addColorStop(1,t.color||'#47ff9b');
        ctx.beginPath(); ctx.arc(t.x,t.y+bob,r+5,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fill();
        ctx.beginPath(); ctx.arc(t.x,t.y+bob,r,0,Math.PI*2); ctx.fillStyle=grd; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2; ctx.stroke();
        ctx.font='18px Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t.emoji,t.x,t.y+bob);
        ctx.restore();
      }
    }

    if(state==='celebrate'){
      drawCelebrationStage();
      for(const c of (celeb.confetti||[])){ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.r); ctx.fillStyle=confettiColor(c); ctx.fillRect(-c.s/2,-c.s/2,c.s,c.s); ctx.restore(); }
    }

    // птица
    ctx.save(); ctx.translate(bird.x+bird.w/2,bird.y+bird.h/2);
    const tilt=Math.max(-0.35,Math.min(0.35,bird.vy/700)); ctx.rotate(tilt);
    if(birdImg.complete){ const s=Math.min(bird.w/birdW0,bird.h/birdH0); ctx.drawImage(birdImg,-birdW0*s/2,-birdH0*s/2,birdW0*s,birdH0*s);} else { ctx.fillStyle="#00ff66"; ctx.fillRect(-bird.w/2,-bird.h/2,bird.w,bird.h);}
    ctx.restore();

    if(state==='ready'){ centerText('Нажми Старт',28); }
    if(state==='gameover'){ centerText('Игра окончена',30); }
    if(state==='pause'){ centerText('Пауза',28); }

    // всплывающие очки
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const p of popups){ const a=Math.max(0,1-p.life/0.9); ctx.globalAlpha=a; ctx.font='700 18px Inter'; ctx.fillStyle='#ffffff'; ctx.fillText(p.text,p.x,p.y); }
    ctx.restore();
  }
  function centerText(t,fs){
    ctx.font=`800 ${fs}px Inter`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillText(t, innerWidth/2+2, CONFIG.topRailH+130+2);
    ctx.fillStyle='#e8ffee'; ctx.fillText(t, innerWidth/2, CONFIG.topRailH+130);
  }

  // ---------- loop ----------
  function loop(now){ const dt=Math.min(0.032,(now-last)/1000); last=now;
    if(['playing','celebrate'].includes(state)) update(dt); draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  // ---------- controls ----------
  const anyOverlay=()=> (startOverlay.style.display!=='none'||winOverlay.style.display!=='none'||loseOverlay.style.display!=='none'||historyOverlay.style.display!=='none');
  canvas.addEventListener('pointerdown', ()=>{ if(state==='playing') bird.vy=-CONFIG.jump; else if(state==='ready') startGame(); });
  addEventListener('keydown', (e)=>{
    if(anyOverlay() && (e.code==='Space'||e.code==='Enter')) e.preventDefault();
    if(e.code==='Space'){ if(state==='playing') bird.vy=-CONFIG.jump; else if(state==='ready') startGame(); }
    if(e.code==='KeyP'){ if(state==='playing') state='pause'; else if(state==='pause') state='playing'; }
    if(e.code==='Enter' && state!=='playing') startGame();
  });

  pauseBtn.addEventListener('click', ()=>{ if(state==='playing') state='pause'; else if(state==='pause') state='playing'; });
  resetBtn.addEventListener('click', resetGame);
  overlayStartBtn.addEventListener('click', ()=>{ applyLevel(levelSel.value); resetGame(); showStart(false); startGame(); });
  levelSel.addEventListener('change', ()=>applyLevel(levelSel.value));
  nextBtn&&nextBtn.addEventListener('click', ()=>{ const n=Math.min(3,currentLevel+1); applyLevel(n); resetGame(); showWin(false); startGame(); });
  retryBtn&&retryBtn.addEventListener('click', ()=>{ applyLevel(currentLevel); resetGame(); showWin(false); startGame(); });
  chooseBtn&&chooseBtn.addEventListener('click', ()=>{ showWin(false); showStart(true); });

  loseRetryBtn.addEventListener('click', ()=>{ applyLevel(currentLevel); resetGame(); showLose(false); startGame(); });
  loseMenuBtn.addEventListener('click', ()=>{ showLose(false); showStart(true); });

  openHistoryBtn.addEventListener('click', ()=>{ renderHistory(); historyOverlay.style.display='flex'; startOverlay.style.display='none'; });
  backFromHistoryBtn.addEventListener('click', ()=>{ historyOverlay.style.display='none'; startOverlay.style.display='flex'; });

  // старт
  resetGame();
})();
</script>
</body>
